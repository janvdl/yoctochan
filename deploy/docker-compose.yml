# Run from this directory: `docker compose up -d --build`
# (or `podman-compose up -d --build`). Reads ../.env — copy ../.env.example
# there first and fill it in; see ../README.md's Deployment section.

services:
  db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yoctochan}
      POSTGRES_USER: ${POSTGRES_USER:-yoctochan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yoctochan}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: docker.io/library/redis:7-alpine
    restart: unless-stopped
    # No volume: this is a cache, not a store — losing it on restart just
    # means the next few requests repopulate it.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Wiring specific to this compose topology (service names, internal
      # ports) rather than a per-deployment secret — kept out of .env.
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DATABASE_ENGINE: postgresql
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/1
      TRUST_X_FORWARDED_FOR: "true"
    volumes:
      - media_volume:/app/media
      - static_volume:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthz/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - static_volume:/srv/static:ro
      - media_volume:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  postgres_data:
  media_volume:
  static_volume:
  caddy_data:
  caddy_config:
