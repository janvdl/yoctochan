{% extends "mod/base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}

<h2>Log in</h2>

{% if form.errors %}
    <p class="errorlist">Incorrect username or password.</p>
{% endif %}

<form method="post" action="{% url 'mod-login' %}">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <p>
        <button type="submit">Log in</button>
    </p>
</form>

{% endblock %}
